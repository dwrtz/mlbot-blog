name: Publish

on:
  push:
    branches:
      - live

permissions:
  contents: read
  deployments: write

concurrency:
  group: publish-live
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish to Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.161.0"
      HUGO_ENVIRONMENT: "production"
      HUGO_ENV: "production"
      TZ: "Asia/Kolkata"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Install Node dependencies
        run: npm ci

      - name: Install local KaTeX assets
        run: npm run setup:katex

      - name: Validate content for publish
        run: npm run validate:publish

      - name: Generate Open Graph images
        run: npm run generate-og

      - name: Build related-post data
        run: npm run build-related

      - name: Build Hugo site
        run: npm run build

      - name: Build Pagefind index
        run: npm run pagefind

      - name: Check links
        run: npm run check-links

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: mlbot-blog
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.CLOUDFLARE_PAGES_PROJECT;
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`;
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json"
          };

          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, { headers, ...options });
            const payload = await response.json().catch(() => ({}));
            return { response, payload };
          }

          const current = await request(`/${project}`);
          if (current.response.ok && current.payload.success) {
            console.log(`${project} already exists.`);
            process.exit(0);
          }

          const created = await request("", {
            method: "POST",
            body: JSON.stringify({
              name: project,
              production_branch: "live",
              build_config: {
                build_command: "",
                destination_dir: "public",
                root_dir: "/",
                build_caching: false
              }
            })
          });

          if (!created.response.ok || !created.payload.success) {
            console.error(JSON.stringify(created.payload, null, 2));
            process.exit(1);
          }

          console.log(`Created ${project}.`);
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=mlbot-blog --branch=live --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach custom domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: mlbot-blog
          CUSTOM_DOMAIN: mlbot.blog
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = process.env.CLOUDFLARE_PAGES_PROJECT;
          const domain = process.env.CUSTOM_DOMAIN;
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects/${project}/domains`;
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json"
          };

          async function request(path, options = {}) {
            const response = await fetch(`${base}${path}`, { headers, ...options });
            const payload = await response.json().catch(() => ({}));
            return { response, payload };
          }

          const current = await request(`/${encodeURIComponent(domain)}`);
          if (current.response.ok && current.payload.success) {
            console.log(`${domain} is already attached to ${project}.`);
            process.exit(0);
          }

          const created = await request("", {
            method: "POST",
            body: JSON.stringify({ name: domain })
          });

          if (!created.response.ok || !created.payload.success) {
            console.error(JSON.stringify(created.payload, null, 2));
            process.exit(1);
          }

          console.log(`Attached ${domain} to ${project}.`);
          NODE

      - name: Ensure custom-domain DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTOM_DOMAIN: mlbot.blog
          PAGES_HOSTNAME: mlbot-blog.pages.dev
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const domain = process.env.CUSTOM_DOMAIN;
          const pagesHostname = process.env.PAGES_HOSTNAME;
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json"
          };

          async function cf(url, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${url}`, { headers, ...options });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload.success) {
              const error = new Error(JSON.stringify(payload, null, 2));
              error.payload = payload;
              throw error;
            }
            return payload.result;
          }

          let zones;
          try {
            zones = await cf(`/zones?name=${encodeURIComponent(domain)}`);
          } catch (error) {
            if (error.payload?.errors?.some((item) => item.code === 10000)) {
              console.warn(`Could not manage DNS for ${domain}: Cloudflare token is not authorized for the Zones API.`);
              console.warn(`Create a proxied CNAME record for ${domain} pointing to ${pagesHostname}, or add Zone:Read and DNS:Edit permissions to the token.`);
              process.exit(0);
            }
            throw error;
          }
          const zone = zones.find((item) => item.name === domain);
          if (!zone) {
            throw new Error(`Cloudflare zone ${domain} was not found.`);
          }

          const records = await cf(`/zones/${zone.id}/dns_records?name=${encodeURIComponent(domain)}`);
          const conflicts = records.filter((record) => record.type !== "CNAME");
          if (conflicts.length > 0) {
            throw new Error(`${domain} has non-CNAME DNS records that must be reviewed before creating the Pages CNAME.`);
          }

          const existing = records.find((record) => record.type === "CNAME");
          const body = JSON.stringify({
            type: "CNAME",
            name: domain,
            content: pagesHostname,
            ttl: 1,
            proxied: true
          });

          if (existing) {
            await cf(`/zones/${zone.id}/dns_records/${existing.id}`, { method: "PUT", body });
            console.log(`Updated ${domain} CNAME to ${pagesHostname}.`);
          } else {
            await cf(`/zones/${zone.id}/dns_records`, { method: "POST", body });
            console.log(`Created ${domain} CNAME to ${pagesHostname}.`);
          }
          NODE
