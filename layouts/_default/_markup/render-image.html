{{ $image := .Page.Resources.GetMatch .Destination }}
{{ if $image }}
  <img
    src="{{ $image.RelPermalink }}"
    width="{{ $image.Width }}"
    height="{{ $image.Height }}"
    alt="{{ .Text }}"
    loading="lazy"
    decoding="async"{{ with .Title }}
    title="{{ . }}"{{ end }}>
{{ else }}
  <img
    src="{{ .Destination | safeURL }}"
    alt="{{ .Text }}"
    loading="lazy"
    decoding="async"{{ with .Title }}
    title="{{ . }}"{{ end }}>
{{ end }}
