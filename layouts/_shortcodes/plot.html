{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $caption := .Get "caption" }}
{{ $source := .Get "source" }}
{{ with .Page.Resources.GetMatch $src }}
  <figure class="plot">
    <img src="{{ .RelPermalink }}" alt="{{ $alt }}">
    {{ if or $caption $source }}
      <figcaption>
        {{ with $caption }}{{ . }}{{ end }}
        {{ with $source }} <a href="{{ . }}">Source</a>{{ end }}
      </figcaption>
    {{ end }}
  </figure>
{{ else }}
  {{ errorf "plot shortcode could not find %q in %s" $src .Page.File.Path }}
{{ end }}
